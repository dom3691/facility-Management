<button
  mat-icon-button
  [matMenuTriggerFor]="menu"
  aria-label="Notifications"
  class="nb__trigger"
>
  <mat-icon
    [matBadge]="unreadCount()"
    [matBadgeHidden]="unreadCount() === 0"
    matBadgeColor="warn"
    matBadgeSize="small"
  >
    notifications
  </mat-icon>
</button>

<mat-menu #menu="matMenu" xPosition="before" class="nb__menu">
  <div class="nb__header" (click)="$event.stopPropagation()">
    <span class="nb__title">Notifications</span>
    @if (unreadCount() > 0) {
      <span class="nb__count">{{ unreadCount() }} new</span>
    }
  </div>

  <mat-divider />

  @if (notifications().length === 0) {
    <div class="nb__empty" (click)="$event.stopPropagation()">
      <mat-icon>notifications_none</mat-icon>
      <p>You're all caught up</p>
    </div>
  } @else {
    @for (n of notifications(); track n.title) {
      <button mat-menu-item class="nb__item">
        <span class="nb__item-title">{{ n.title }}</span>
        <span class="nb__item-msg">{{ n.message }}</span>
        <span class="nb__item-time">{{ n.time }}</span>
      </button>
    }
  }

  <mat-divider />

  <a mat-menu-item routerLink="/notifications" class="nb__all">
    <mat-icon>open_in_new</mat-icon>
    <span>View all notifications</span>
  </a>
</mat-menu>
